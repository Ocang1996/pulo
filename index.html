<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulo untuk Windows</title>
<meta name="description" content="Pulo adalah pulau kecil di tepi atas layar Windows, rumah NIX si kucing hitam. Musik, notifikasi, timer, tugas, widget, dock, dan jam desktop. Coba langsung di browser.">
<meta name="theme-color" content="#0B0B0C">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/favicon.png">
<link rel="alternate" hreflang="id" href="https://ocang1996.github.io/pulo/?lang=id">
<link rel="alternate" hreflang="en" href="https://ocang1996.github.io/pulo/?lang=en">
<link rel="alternate" hreflang="x-default" href="https://ocang1996.github.io/pulo/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Pulo">
<meta property="og:title" content="Pulo untuk Windows · Pulo for Windows">
<meta property="og:description" content="Pulau kecil di tepi atas layar Windows, rumah NIX si kucing hitam. A small island at the top of your Windows screen, home to NIX the black cat.">
<meta property="og:url" content="https://ocang1996.github.io/pulo/">
<meta property="og:image" content="https://ocang1996.github.io/pulo/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500;600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css?v=7">
<link rel="stylesheet" href="sim.css?v=7">
<script src="i18n.js?v=7"></script>
</head>
<body>

<nav id="notch" data-i18n-attr="aria-label:nav.label">
  <img id="notchNix" src="assets/nix-neutral.png" width="310" height="280" alt="">
  <a href="#fitur" data-i18n="nav.features">Fitur</a><a href="#coba" data-i18n="nav.try">Coba</a><a class="opt" href="#dock" data-i18n="nav.dock">Dock</a><a class="opt" href="#jam" data-i18n="nav.clock">Jam</a><a href="#unduh" data-i18n="nav.get">Unduh</a><a class="opt" href="#faq" data-i18n="nav.faq">Tanya</a>
  <button id="langBtn" type="button" data-i18n="lang.switch" data-i18n-attr="aria-label:lang.switchLabel">EN</button>
</nav>

<header class="hero">
  <div class="wrap">
    <h1 data-i18n="hero.title" data-anim="hero">Layar Anda punya pulau.<br>NIX tinggal di sana.</h1>
    <p class="lede" data-i18n="hero.lede" data-anim="hero"></p>
    <div class="cta" data-anim="hero">
      <a class="btn" href="#coba" data-i18n="hero.try">Coba di browser</a>
      <a class="textlink" href="#unduh" data-i18n="hero.get">Unduh untuk Windows</a>
    </div>
    <p class="meta" data-anim="hero"><span data-version>Versi 1.0.0</span> · <span data-i18n="hero.meta"></span><span data-count-line hidden> · <span data-count-text></span></span></p>
  </div>
  <div class="shore">
    <svg viewBox="0 0 1440 300" preserveAspectRatio="none" aria-hidden="true"><path fill="#0B0B0C" d="M0 262C210 276 430 268 620 232 760 205 850 118 1012 104c150-13 236 74 428 106v90H0z"/></svg>
    <p id="heroSay" role="status" data-i18n="hero.say">Klik aku.</p>
    <button id="heroNix" type="button" data-i18n-attr="aria-label:hero.nixLabel"><img id="heroFace" src="assets/nix-happy.png" width="310" height="280" data-i18n-attr="alt:hero.nixAlt" alt=""></button>
  </div>
</header>

<main>

<section id="fitur">
  <div class="wrap">
    <h2 data-i18n="bento.title" data-anim="up"></h2>
    <p class="lede" data-i18n="bento.lede" data-anim="up"></p>
    <div class="bento">
      <button type="button" class="bc w3 tall" data-try="play" data-preview="music"><div class="scr warm"></div><div class="bt"><h3 data-i18n="b.music.t"></h3><p data-i18n="b.music.d"></p><span class="go" data-i18n="bento.try"></span></div></button>
      <button type="button" class="bc w3 tall" data-try="message" data-preview="alert"><div class="scr"></div><div class="bt"><h3 data-i18n="b.alert.t"></h3><p data-i18n="b.alert.d"></p><span class="go" data-i18n="bento.try"></span></div></button>
      <button type="button" class="bc w4 wide-m" data-try="home" data-preview="home"><div class="scr"></div><div class="bt"><h3 data-i18n="b.home.t"></h3><p data-i18n="b.home.d"></p><span class="go" data-i18n="bento.try"></span></div></button>
      <button type="button" class="bc" data-try="timer" data-preview="timer"><div class="scr warm"></div><div class="bt"><h3 data-i18n="b.timer.t"></h3><p data-i18n="b.timer.d"></p><span class="go" data-i18n="bento.try"></span></div></button>
      <button type="button" class="bc" data-try="shelf" data-preview="shelf"><div class="scr"></div><div class="bt"><h3 data-i18n="b.shelf.t"></h3><p data-i18n="b.shelf.d"></p><span class="go" data-i18n="bento.try"></span></div></button>
      <button type="button" class="bc" data-try="tasks" data-preview="tasks"><div class="scr warm"></div><div class="bt"><h3 data-i18n="b.tasks.t"></h3><p data-i18n="b.tasks.d"></p><span class="go" data-i18n="bento.try"></span></div></button>
      <button type="button" class="bc" data-try="agentWork" data-preview="agent"><div class="scr"></div><div class="bt"><h3 data-i18n="b.agent.t"></h3><p data-i18n="b.agent.d"></p><span class="go" data-i18n="bento.try"></span></div></button>
      <button type="button" class="bc w3" data-try="system" data-preview="system"><div class="scr warm"></div><div class="bt"><h3 data-i18n="b.system.t"></h3><p data-i18n="b.system.d"></p><span class="go" data-i18n="bento.try"></span></div></button>
      <button type="button" class="bc w3" data-try="blur" data-preview="look"><div class="scr blue"></div><div class="bt"><h3 data-i18n="b.look.t"></h3><p data-i18n="b.look.d"></p><span class="go" data-i18n="bento.try"></span></div></button>
      <button type="button" class="bc w3" data-try="genie" data-preview="dock"><div class="scr warm"></div><div class="bt"><h3 data-i18n="b.dock.t"></h3><p data-i18n="b.dock.d"></p><span class="go" data-i18n="bento.try"></span></div></button>
      <button type="button" class="bc w3" data-try="clockBold" data-preview="clock"><div class="scr blue"></div><div class="bt"><h3 data-i18n="b.clock.t"></h3><p data-i18n="b.clock.d"></p><span class="go" data-i18n="bento.try"></span></div></button>
    </div>
  </div>
</section>

<section class="ink" id="coba">
  <div class="wrap">
    <h2 data-i18n="try.title" data-anim="up"></h2>
    <p class="lede" data-i18n="try.lede" data-anim="up"></p>
    <div class="simgrid">
      <div id="groups"></div>
      <div id="simTop">
        <div id="stageBox"><div id="stage">
          <svg id="wall" viewBox="0 0 980 560" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
            <defs>
              <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1B2A52"/><stop offset=".42" stop-color="#5B5A94"/><stop offset=".62" stop-color="#D98FA4"/><stop offset=".72" stop-color="#F5C6A5"/></linearGradient>
              <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C98AA3"/><stop offset=".3" stop-color="#5D5F99"/><stop offset="1" stop-color="#172447"/></linearGradient>
            </defs>
            <rect width="980" height="400" fill="url(#sky)"/>
            <circle cx="640" cy="372" r="46" fill="#FFE3C4"/>
            <path fill="#46477F" d="M0 392c70-34 130-46 196-30 54 13 88 30 150 30zM560 392c60-44 130-74 206-68 76 6 130 40 214 58v10z"/>
            <rect y="390" width="980" height="170" fill="url(#water)"/>
            <path fill="#FFE3C4" opacity=".5" d="M606 398h68l-6 6h-56zm-14 16h96l-8 7h-80zm-16 21h128l-12 8h-104z"/>
            <path fill="#101A36" d="M0 560V498c120-30 240-34 380-6 160 32 380 40 600-12v80z"/>
          </svg>
          <div id="simClock" hidden data-i18n-attr="aria-label:try.clockLabel"></div>
          <div id="winHost"></div>
          <div id="taskbar"><i></i><i></i><i></i><span id="taskClock"></span></div>
          <div id="dockEdge"></div>
          <div id="simDock" data-i18n-attr="aria-label:try.dockLabel"></div>
          <div id="isl" class="isl medium dock"><div id="islBody"></div></div>
        </div></div>
        <p id="caption" role="status" data-i18n="try.caption"></p>
      </div>
    </div>
  </div>
</section>

<section class="plain">
  <div class="wrap">
    <h2 data-i18n="nix.title" data-anim="up"></h2>
    <p class="lede" data-i18n="nix.lede" data-anim="up"></p>
    <div id="faces"></div>
  </div>
</section>

<section class="plain" id="dock" style="padding-top:0">
  <div class="wrap split">
    <div data-anim="up">
      <h2 data-i18n="dock.title"></h2>
      <p class="lede" data-i18n="dock.lede"></p>
    </div>
    <ul class="rows" data-anim="up">
      <li><span data-i18n="dock.r1"></span><button type="button" data-try="dock" data-i18n="try.btn"></button></li>
      <li><span data-i18n="dock.r2"></span><button type="button" data-try="genie" data-i18n="try.btn"></button></li>
      <li><span data-i18n="dock.r3"></span><button type="button" data-try="standard" data-i18n="try.btn"></button></li>
      <li><span data-i18n="dock.r4"></span><button type="button" data-try="dockSize" data-i18n="try.btn"></button></li>
      <li><span data-i18n="dock.r5"></span><button type="button" data-try="hideTaskbar" data-i18n="try.btn"></button></li>
      <li><span data-i18n="dock.r6"></span><button type="button" data-try="dockAlways" data-i18n="try.btn"></button></li>
    </ul>
  </div>
</section>

<section class="plain" id="jam" style="padding-top:0">
  <div class="wrap split">
    <div data-anim="up">
      <h2 data-i18n="clock.title"></h2>
      <p class="lede" data-i18n="clock.lede"></p>
    </div>
    <div data-anim="up">
      <div id="clockShow" data-i18n-attr="aria-label:clock.showLabel"></div>
      <div class="seg" role="group" data-i18n-attr="aria-label:clock.styles"><span data-i18n="clock.styles"></span><button type="button" data-clock-style="line" data-i18n="clock.line"></button><button type="button" data-clock-style="bold" data-i18n="clock.bold"></button><button type="button" data-clock-style="round" data-i18n="clock.round"></button></div>
      <ul class="rows">
        <li><span data-i18n="clock.r1"></span><button type="button" data-try="clockMove" data-i18n="try.btn"></button></li>
        <li><span data-i18n="clock.r2"></span><button type="button" data-try="clockMove" data-i18n="try.btn"></button></li>
        <li><span data-i18n="clock.r3"></span><button type="button" data-try="clockLock" data-i18n="try.btn"></button></li>
      </ul>
    </div>
  </div>
</section>

<section class="plain" style="padding-top:0">
  <div class="wrap">
    <p class="statement" data-i18n="privacy.statement" data-anim="up"></p>
    <div class="stats" data-anim="up">
      <div><b data-count-to="40" data-prefix="&lt;" data-suffix=" MB">&lt;40 MB</b><span data-i18n="stat.ram"></span></div>
      <div><b>0%</b><span data-i18n="stat.cpu"></span></div>
      <div><b data-count-to="8" data-prefix="±" data-suffix=" MB">±8 MB</b><span data-i18n="stat.size"></span></div>
      <div><b>0</b><span data-i18n="stat.account"></span></div>
    </div>
    <p class="fine" data-i18n="privacy.fine"></p>
  </div>
</section>

<section class="ink" id="unduh">
  <div class="wrap">
    <h2 data-i18n="get.title" data-anim="up"></h2>
    <div class="get">
      <div>
        <h3 data-i18n="get.store"></h3>
        <p data-i18n="get.storeText"></p>
        <div class="act" data-store><span class="pending" data-i18n="get.soon"></span></div>
      </div>
      <div>
        <h3 data-i18n="get.zip"></h3>
        <p><span data-i18n="get.zipText"></span><span data-count-line hidden data-zip-count></span></p>
        <div class="act" data-zip><span class="pending" data-i18n="get.soon"></span></div>
      </div>
      <div>
        <h3 data-i18n="get.coffee"></h3>
        <p data-i18n="get.coffeeText"></p>
        <div class="act coffee"><span data-coffee></span><img src="assets/saweria-qr.svg" width="104" height="104" data-i18n-attr="alt:get.qrAlt" alt=""></div>
      </div>
    </div>
    <div class="guide" id="pasang">
      <div class="guide-head">
        <div>
          <h3 data-i18n="install.title"></h3>
          <p data-i18n="install.lede"></p>
        </div>
        <div class="gtabs" role="tablist" data-i18n-attr="aria-label:install.tabs">
          <button type="button" role="tab" id="tab-store" aria-controls="steps-store" aria-selected="true" data-guide="store" data-i18n="get.store"></button>
          <button type="button" role="tab" id="tab-zip" aria-controls="steps-zip" aria-selected="false" data-guide="zip" tabindex="-1" data-i18n="get.zip"></button>
        </div>
      </div>
      <div role="tabpanel" id="steps-store" aria-labelledby="tab-store"><ol class="gsteps" data-steps="install.store"></ol><p class="gnote" data-i18n="install.storeNote"></p></div>
      <div role="tabpanel" id="steps-zip" aria-labelledby="tab-zip" hidden><ol class="gsteps" data-steps="install.zip"></ol><p class="gnote" data-i18n="install.zipNote"></p></div>
      <div class="ghelp">
        <h4 data-i18n="install.helpTitle"></h4>
        <dl data-help="install.help"></dl>
      </div>
    </div>
    <div class="req" id="syarat">
      <h3 data-i18n="req.title"></h3>
      <dl>
        <div><dt data-i18n="req.os"></dt><dd data-i18n="req.osV"></dd></div>
        <div><dt data-i18n="req.cpu"></dt><dd data-i18n="req.cpuV"></dd></div>
        <div><dt data-i18n="req.mem"></dt><dd data-i18n="req.memV"></dd></div>
        <div><dt data-i18n="req.disk"></dt><dd data-i18n="req.diskV"></dd></div>
        <div><dt data-i18n="req.net"></dt><dd data-i18n="req.netV"></dd></div>
      </dl>
    </div>
  </div>
</section>

<section id="faq">
  <div class="wrap">
    <h2 data-i18n="faq.title" data-anim="up"></h2>
    <div class="qa" id="qa"></div>
  </div>
</section>

<section id="masukan">
  <div class="wrap">
    <div class="fb" data-anim="up">
      <img class="peek" src="assets/nix-happy.png" width="310" height="280" alt="">
      <div>
        <h2 data-i18n="fb.title"></h2>
        <p class="lede" data-i18n="fb.lede"></p>
      </div>
      <div class="acts">
        <a class="btn" href="https://github.com/Ocang1996/pulo/issues/new" target="_blank" rel="noopener" data-i18n="fb.new"></a>
        <a class="textlink" href="https://github.com/Ocang1996/pulo/issues" target="_blank" rel="noopener" data-i18n="fb.list"></a>
      </div>
      <p class="note" data-i18n="fb.note"></p>
    </div>
  </div>
</section>

</main>

<footer class="ink">
  <div class="wrap">
    <span><span data-i18n="foot.by"></span> <a href="privacy.html" data-i18n="foot.privacy"></a></span>
    <span data-i18n="foot.note"></span>
  </div>
</footer>

<script>PuloI18n.apply();</script>
<script src="https://cdn.jsdelivr.net/npm/motion@11.11.17/dist/motion.js"></script>
<script src="site.js?v=7"></script>
<script src="sim.js?v=7"></script>
<script src="fx.js?v=7"></script>
</body>
</html>
